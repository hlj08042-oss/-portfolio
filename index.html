  <style>
    :root { color-scheme:dark; --bg:#09090b; --panel:#151518; --text:#fafafa; --muted:#a1a1aa; --line:#29292e; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    header { position:sticky; top:0; z-index:10; min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:12px 20px; border-bottom:1px solid var(--line); background:rgba(9,9,11,.9); backdrop-filter:blur(16px); }
    .brand { display:flex; align-items:baseline; gap:12px; min-width:0; }
    h1 { margin:0; font-size:1rem; letter-spacing:.03em; white-space:nowrap; }
    .meta { color:var(--muted); font-size:.78rem; white-space:nowrap; }
    nav { display:flex; gap:8px; }
    .button { min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 14px; border:1px solid var(--line); border-radius:999px; color:var(--text); text-decoration:none; font-size:.86rem; background:var(--panel); transition:.2s ease; }
    .button:hover { background:#26262b; border-color:#47474f; transform:translateY(-1px); }
    .primary { background:var(--text); color:var(--bg); border-color:var(--text); }
    main { width:min(1600px,100%); margin:0 auto; padding:24px; }
    .page { display:block; width:100%; height:auto; margin:0 auto 24px; background:#111; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    .page:last-child { margin-bottom:0; }
    @media (max-width:640px) { header{min-height:58px;padding:9px 10px}.meta{display:none}.button{min-height:38px;padding:0 11px;font-size:.8rem}.button span{display:none}main{padding:10px}.page{margin-bottom:10px} }
  </style>
</head>
