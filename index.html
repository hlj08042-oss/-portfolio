<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="description" content="王心愉个人设计作品集在线浏览" />
  <title>王心愉作品集</title>
  <style>
    :root { color-scheme:dark; --bg:#09090b; --panel:#151518; --text:#fafafa; --muted:#a1a1aa; --line:#29292e; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; background:var(--bg); font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
    body { display:grid; grid-template-rows:auto 1fr; overflow:hidden; color:var(--text); }
    header { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:12px 20px; border-bottom:1px solid var(--line); background:rgba(9,9,11,.96); }
    .brand { display:flex; align-items:baseline; gap:12px; min-width:0; }
    h1 { margin:0; font-size:1rem; letter-spacing:.03em; white-space:nowrap; }
    .meta { color:var(--muted); font-size:.78rem; white-space:nowrap; }
    nav { display:flex; gap:8px; }
    .button { min-height:40px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 14px; border:1px solid var(--line); border-radius:999px; color:var(--text); text-decoration:none; font-size:.86rem; background:var(--panel); }
    .primary { background:var(--text); color:var(--bg); border-color:var(--text); }
    main { min-height:0; position:relative; background:#202024; }
    iframe { display:block; width:100%; height:100%; border:0; background:#fff; }
    .fallback { position:absolute; inset:0; display:grid; place-items:center; padding:24px; text-align:center; z-index:-1; }
    @media (max-width:640px) { header{min-height:58px;padding:9px 10px}.meta{display:none}.button{min-height:38px;padding:0 11px;font-size:.8rem}.button span{display:none} }
  </style>
</head>
<body>
  <header>
    <div class="brand"><h1>王心愉作品集</h1><span class="meta">ORIGINAL HD · 31 PAGES</span></div>
    <nav aria-label="作品集操作">

      <a class="button primary" href="assets/wang-xinyu-portfolio.pdf" download="王心愉作品集.pdf">↓ <span>下载原版 PDF</span></a>
    </nav>
  </header>
  <main>
    <div class="fallback"><a class="button primary" href="assets/wang-xinyu-portfolio.pdf">打开高清作品集</a></div>
    <iframe src="assets/wang-xinyu-portfolio.pdf#view=FitH&toolbar=1" title="王心愉高清作品集"></iframe>

</body>
</html>
